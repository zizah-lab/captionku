<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captionku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f5f7;
      color: #222;
    }
    h1 { text-align: center; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background: #a5a3d9; cursor: not-allowed; }
    #hasil {
      margin-top: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Captionku</h1>
  <div class="card">
    <input id="topik" placeholder="Tulis topik, misalnya: liburan ke pantai">
    <button id="btn">Generate Caption</button>
    <p id="hasil"></p>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const topik = document.getElementById("topik");
    const hasil = document.getElementById("hasil");

    btn.addEventListener("click", async () => {
      const inputDariUser = topik.value.trim();
      if (!inputDariUser) {
        hasil.textContent = "Isi topiknya dulu ya.";
        return;
      }

      btn.disabled = true;
      hasil.textContent = "Lagi bikin caption...";

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: inputDariUser }),
        });
        const data = await res.json();
        hasil.textContent = data.caption || data.error || "Terjadi kesalahan.";
      } catch (e) {
        hasil.textContent = "Gagal terhubung ke server.";
      }

      btn.disabled = false;
    });
  </script>
</body>
</html>
